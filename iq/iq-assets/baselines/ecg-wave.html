<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心电图监护仪 · ECG Monitor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #0f0;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      margin-bottom: 1rem;
      color: #00ff41;
      text-shadow: 0 0 8px #00ff41;
      opacity: 0.85;
    }
    .monitor {
      position: relative;
      border: 6px solid #1a1a1a;
      border-radius: 12px;
      box-shadow:
        0 0 0 2px #333,
        0 0 30px rgba(0, 255, 65, 0.15),
        inset 0 0 60px rgba(0, 0, 0, 0.8);
      background: #000;
      overflow: hidden;
    }
    .monitor::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 6px;
      box-shadow: inset 0 0 40px rgba(0, 40, 0, 0.4);
      pointer-events: none;
      z-index: 2;
    }
    svg {
      display: block;
      background: #001a00;
    }
    /* 扫描线发光 */
    .beam {
      filter: url(#strongGlow);
    }
    /* 波形发光 + 滚动 */
    #wave {
      filter: url(#glow);
      animation: scroll 0.8s linear infinite;
    }
    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-200px); }
    }
    .info {
      margin-top: 0.8rem;
      font-size: 0.75rem;
      color: #0a5a0a;
      letter-spacing: 0.05em;
    }
    .info span {
      color: #00ff41;
      margin: 0 0.4em;
    }
  </style>
</head>
<body>
  <h1>ECG MONITOR · 心电监护</h1>
  <div class="monitor">
    <svg id="svg" width="800" height="360" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 细网格 -->
        <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0a2f0a" stroke-width="0.6"/>
        </pattern>
        <!-- 粗网格（每 5 小格） -->
        <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
          <rect width="100" height="100" fill="url(#smallGrid)"/>
          <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#0d4a0d" stroke-width="1.2"/>
        </pattern>
        <!-- 波形柔和辉光 -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- 扫描线强辉光 -->
        <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- 背景 -->
      <rect width="800" height="360" fill="#001400"/>
      <!-- 网格 -->
      <rect width="800" height="360" fill="url(#grid)" opacity="0.9"/>

      <!-- 心电波形（由 JS 生成，多周期保证无缝循环） -->
      <g id="wave">
        <path id="ecgPath"
              fill="none"
              stroke="#00ff41"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"/>
      </g>

      <!-- 右侧扫描线（代表当前写入位置） -->
      <line class="beam" x1="785" y1="10" x2="785" y2="350"
            stroke="#00ff66" stroke-width="2.5" opacity="0.95"/>
      <!-- 扫描线顶部小亮点 -->
      <circle class="beam" cx="785" cy="180" r="3.5" fill="#aaffaa"/>
    </svg>
  </div>
  <p class="info">HR <span>75</span> bpm · 循环滚动 · QRS 清晰可见</p>

  <script>
    (function () {
      const CYCLE = 200;      // 一个心动周期的宽度（用户单位）
      const BASE  = 180;      // 基线 Y
      const CYCLES = 10;      // 生成足够多的周期以保证滚动无缝

      function createECGPath() {
        let d = `M 0 ${BASE}`;
        for (let c = 0; c < CYCLES; c++) {
          const x = c * CYCLE;

          // 基线 → P 波前
          d += ` L ${x + 28} ${BASE}`;

          // P 波（小圆滑波）
          d += ` Q ${x + 38} ${BASE - 28} ${x + 48} ${BASE}`;

          // PR 段
          d += ` L ${x + 72} ${BASE}`;

          // —— QRS 复合波（尖锐）——
          d += ` L ${x + 78} ${BASE + 18}`;   // Q 波（轻微下探）
          d += ` L ${x + 88} ${BASE - 135}`;  // R 波（高尖峰）
          d += ` L ${x + 98} ${BASE + 42}`;   // S 波（下探）
          d += ` L ${x + 108} ${BASE}`;       // 回到基线

          // ST 段
          d += ` L ${x + 135} ${BASE}`;

          // T 波
          d += ` Q ${x + 155} ${BASE - 48} ${x + 175} ${BASE}`;

          // 剩余基线到周期结束
          d += ` L ${x + CYCLE} ${BASE}`;
        }
        return d;
      }

      const path = document.getElementById('ecgPath');
      path.setAttribute('d', createECGPath());

      // 可选：轻微随机化每次刷新的 R 峰高度，增加真实感（注释掉保持完全规律）
      // 这里保持严格周期，保证视觉完美无缝
    })();
  </script>
</body>
</html>
