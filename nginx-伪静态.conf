# =============================================================================
# Nginx 配置 —— 三个检测站共用一份（放在站点根目录的 server{} 里）
# -----------------------------------------------------------------------------
# 仓库结构就是站点结构：
#   <站点根>/
#   ├── index.html            总入口
#   ├── nav-drop.js           三站共用的导航下拉
#   ├── og-cover.svg          favicon / 分享封面
#   ├── check/               真伪检测
#   ├── iq/                  智商检测
#   └── modeltrace/          归因检测
#
# 每条规则都标了「不做会怎样」，方便按需取舍。全部不做站点也能用，
# 只是分享链接会变长、或运行数据可能被直接下载。
#
# 用法（宝塔）：站点 →【设置】→【伪静态】→ 把「server 块内」的部分整段粘进去。
# 用法（原生 Nginx）：并入 server{} 段后 reload。
# =============================================================================

# -----------------------------------------------------------------------------
# 1) 运行数据目录一律禁止外网访问
# -----------------------------------------------------------------------------
# 三个站把分享报告、会话、限流计数写在各自的 data/ 下（check/data、
# iq/data、modeltrace/data）。nginx 命中静态文件时不经过 PHP，不挡就等于
# 把所有人的报告原文（含中转站地址）挂在公网可下载。
#
# ⚠ 注意是 /<项目>/data/，不是 /data/ —— 三站并入同一仓库后，以前那种
#   一条 `^/(data|tests)/` 已经匹配不到了。
# ⚠ modeltrace/data/bank/ 是内置指纹库，不是运行数据；它跟着 PHP 逻辑走，
#   直接访问也只是读到一份公开基准，但为免混淆一并挡住（前端走同目录相对路径不受影响）。
location ~ ^/(check|iq|modeltrace)/data/ {
    deny all;
    return 404;
}

# 测试目录同理：里面是源码级用例，没必要对外。
location ~ ^/(check|iq|modeltrace)/tests/ {
    deny all;
    return 404;
}

# -----------------------------------------------------------------------------
# 2) 无后缀访问（/check/report → /check/report.html）
# -----------------------------------------------------------------------------
location / {
    # 真实存在的文件/目录直接返回；否则补 .html；再不行 404
    try_files $uri $uri/ $uri.html =404;
}

# 带 .html 的地址 301 到无后缀版本，让分享出去的长短链保持统一。
# 站点在反代后面时必须写死 https:// —— 否则 $scheme 可能是 http，形成降级跳转。
if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
    return 301 https://$host/$1$2;
}

# -----------------------------------------------------------------------------
# 3) 分享短链重写
# -----------------------------------------------------------------------------
# iq 与 modeltrace 的分享链接是 /iq/s/<id>、/modeltrace/s/<id> 这种形状
# （10 字符 id，整条约 40 余字符，能在微信里单行显示完整）。
# 它们各自依赖下面两条重写；不配的话前端会探测失败并退回到更长的 ?id= 链接
# （功能不受影响，只是链接变长）。
#
# ⚠ 重写成 .html 之后，报告页靠头部那段内联脚本按当前路径算 <base>，
#    把 ./assets/... 重新指回站点目录 —— 所以这里不需要额外补路径。
# ⚠ 顺序在 location / 之前，且都是精确前缀，不会与静态文件冲突。

location ~ ^/iq/s/([A-Za-z0-9]+)/?$ {
    rewrite ^ /iq/iq-report.html last;
}

location ~ ^/modeltrace/s/([A-Za-z0-9]+)/?$ {
    rewrite ^ /modeltrace/report.html last;
}

# check 站的分享是 /check/report?id=xxx（报告本身较长，没有再压缩 id）。
# 靠上面第 2 条的 .html 补全即可，无需单独重写。

# -----------------------------------------------------------------------------
# 4) PHP 接口
# -----------------------------------------------------------------------------
# 三站的 api/ 与 *.php 交给 PHP 处理。宝塔通常已自带这一段，重复添加会报
# 「duplicate location」，先看站点原有配置里有没有。
# location ~ \.php$ {
#     include enable-php.conf;
# }

# -----------------------------------------------------------------------------
# 5) （可选）分享写入端点限流
# -----------------------------------------------------------------------------
# 分享是唯一无需登录的写入端点，公开部署建议加一个上限，防止被刷爆磁盘。
# 需要先在 http{} 层定义分区（宝塔：站点 →【配置文件】，加在 server 之前）：
#
#   limit_req_zone $binary_remote_addr zone=detect_share:10m rate=20r/m;
#
# 然后在下方取消注释：
#
# location ~ ^/(check|iq|modeltrace)/.*share\.php$ {
#     limit_req zone=detect_share burst=5 nodelay;
#     include enable-php.conf;
# }
